<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f1215">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kwant Trades">
  <title>Sign in · Kwant Trades</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/pwa.js"></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login" id="main">
    <div class="login-brand">
      <svg width="30" height="30" viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M3 24 L12 15 L18 20 L29 7" class="bm-line"/><circle cx="29" cy="7" r="3" class="bm-dot"/></svg>
      <span class="brand-word">KWANT<span class="brand-edge">TRADES</span></span>
    </div>
    <form class="login-card" id="form" method="post" action="#" novalidate>
      <h1>Sign in</h1>
      <p>Enter the dashboard password you set on the computer running Kwant Trades.</p>
      <div id="msg" class="login-msg" role="alert" aria-live="assertive"></div>
      <div class="field">
        <label for="pw">Password</label>
        <div class="pw-row">
          <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required aria-describedby="msg">
          <button type="button" class="btn ghost" id="toggle" aria-controls="pw" aria-pressed="false">Show</button>
        </div>
      </div>
      <button type="submit" class="btn primary" id="go">Sign in</button>
    </form>
    <p class="login-foot">Model estimates, not guarantees. Paper results do not predict live results.</p>
  </main>
  <noscript><p class="login-foot">Signing in needs JavaScript.</p></noscript>
</body>
</html>
